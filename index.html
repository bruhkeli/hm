<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Gomeng's Secret Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
  :root {
    --sky: #1c2340;
    --sky-2: #2b3560;
    --paper: #f3f1fb;
    --paper-line: #cfd0ea;
    --margin-line: #f0a4b8;
    --ink: #2a3170;
    --ink-soft: #5a5f9a;
    --moon: #ffd76a;
    --btn-bg: #2a3170;
    --btn-fg: #fff8dc;
    --cat: #f0b36b;
    --cat-dark: #d58f45;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #0f1226;
      --sky-2: #1b2145;
      --paper: #262b52;
      --paper-line: #3a4178;
      --margin-line: #b5546f;
      --ink: #e8e9ff;
      --ink-soft: #a5a9df;
      --btn-bg: #ffd76a;
      --btn-fg: #2a2350;
    }
  }
  :root[data-theme="dark"] {
    --sky: #0f1226;
    --sky-2: #1b2145;
    --paper: #262b52;
    --paper-line: #3a4178;
    --margin-line: #b5546f;
    --ink: #e8e9ff;
    --ink-soft: #a5a9df;
    --btn-bg: #ffd76a;
    --btn-fg: #2a2350;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%;
    background: radial-gradient(ellipse at 80% 0%, var(--sky-2), var(--sky) 60%);
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
    font-size: 21px; line-height: 1.55;
    overflow: hidden;
  }
  /* stars */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: var(--moon); opacity: .6;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .1; } }
  .moon {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); right: 22px;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--moon); box-shadow: 0 0 40px 8px rgba(255,215,106,.35);
  }
  .moon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--sky); transform: translate(14px, -6px) scale(.85); opacity: .0;
  }

  .stage {
    position: relative; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .book {
    position: relative; width: min(560px, 100%); height: min(680px, 88%);
    background: var(--paper);
    border-radius: 6px 18px 18px 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 10px 0 0 rgba(0,0,0,.08);
    background-image:
      linear-gradient(90deg, transparent 58px, var(--margin-line) 58px, var(--margin-line) 60px, transparent 60px),
      repeating-linear-gradient(transparent 0 32px, var(--paper-line) 32px 33px);
    background-position: 0 0, 0 14px;
    display: flex; flex-direction: column;
  }
  .rings {
    position: absolute; left: -8px; top: 40px; bottom: 40px; width: 18px;
    display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;
  }
  .rings i { display: block; height: 10px; border-radius: 6px; background: var(--ink-soft); opacity: .55; }

  .page {
    flex: 1; overflow-y: auto; padding: 34px 26px 8px 76px;
    display: none;
  }
  .page.active { display: block; animation: turn .45s ease; }
  @keyframes turn {
    from { opacity: 0; transform: translateX(26px) rotate(.6deg); }
    to   { opacity: 1; transform: none; }
  }
  .date {
    font-family: "Caveat Brush", "Patrick Hand", cursive;
    font-size: 30px; color: var(--ink-soft); margin: 0 0 6px; line-height: 1.1;
  }
  h1 {
    font-family: "Caveat Brush", "Patrick Hand", cursive;
    font-size: 46px; line-height: 1.05; margin: 8px 0 12px; color: var(--ink);
  }
  p { margin: 0 0 14px; }
  .txt .cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sig { text-align: right; font-family: "Caveat Brush", cursive; font-size: 28px; color: var(--ink-soft); }
  .stamp {
    display: inline-block; border: 2px dashed var(--margin-line); color: var(--margin-line);
    padding: 2px 12px; border-radius: 6px; transform: rotate(-4deg); margin: 4px 0 12px;
  }

  .nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 22px 20px 76px; gap: 12px;
  }
  .dots { color: var(--ink-soft); font-size: 16px; }
  button {
    font-family: inherit; font-size: 21px; cursor: pointer;
    background: var(--btn-bg); color: var(--btn-fg);
    border: 0; border-radius: 999px; padding: 8px 22px;
    transition: transform .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }
  button.ghost { background: transparent; color: var(--ink-soft); padding: 8px 6px; }
  button[hidden] { display: none; }

  /* cat peeking over the top of the book */
  .cat { position: absolute; left: 78px; top: -62px; width: 92px; height: 70px; pointer-events: none; }
  .cat .eye { transform-origin: center; animation: eyes 5s infinite; transform-box: fill-box; }
  @keyframes eyes { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .cat .tail { animation: wag 2.2s ease-in-out infinite; transform-origin: 0 100%; transform-box: fill-box; }
  @keyframes wag { 50% { transform: rotate(14deg); } }

  .final-btns { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-top: 10px; min-height: 60px; }
  #no { position: relative; background: transparent; color: var(--ink-soft); border: 2px solid var(--ink-soft); }
  #no.run { position: fixed; z-index: 20; }
  #yes { font-size: 26px; padding: 10px 34px; }
  .hint { font-size: 18px; color: var(--ink-soft); min-height: 28px; }

  /* celebration */
  .heart { position: fixed; top: -30px; pointer-events: none; z-index: 30; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .9; } }
  .zoom { display: inline-block; animation: zoomies .8s ease-in-out infinite alternate; }
  @keyframes zoomies { from { transform: translateX(0) rotate(-6deg); } to { transform: translateX(80px) rotate(6deg); } }

  .mute {
    position: fixed; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 25;
    background: rgba(255,255,255,.12); color: #fff; padding: 6px 12px; font-size: 17px;
  }

  /* ---------- intro: Gomeng walks in with the diary ---------- */
  .stage { opacity: 0; visibility: hidden; transform: scale(.96); }
  body.opened .stage { opacity: 1; visibility: visible; transform: none; transition: opacity .8s ease .3s, transform .8s ease .3s; }
  .intro {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12vh) 24px 0;
    transition: opacity .7s ease, visibility .7s;
  }
  body.opened .intro { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-title { font-family: "Caveat Brush", cursive; font-size: 40px; line-height: 1.1; text-align: center; color: #fff8dc; margin: 0; }
  .intro-sub { color: var(--ink-soft); margin: 8px 0 0; text-align: center; font-size: 19px; color: #b9bcf0; }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(#141a36, #0b0e22);
    border-top: 2px solid rgba(255,215,106,.25);
  }
  .walker {
    position: absolute; left: calc(50% - 120px); bottom: 30%;
    width: 240px; height: 150px;
    animation: walkin 5s cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes walkin { from { transform: translateX(calc(-50vw - 200px)); } to { transform: translateX(0); } }
  .walker svg { width: 240px; height: 150px; display: block; animation: bob .5s ease-in-out infinite alternate; overflow: visible; }
  @keyframes bob { to { transform: translateY(-4px); } }
  .leg { transform-box: fill-box; transform-origin: 50% 0; animation: step .5s ease-in-out infinite alternate; }
  .leg.b { animation-delay: -.25s; }
  @keyframes step { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .walker .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag 1.4s ease-in-out infinite; }
  .walker.arrived svg, .walker.arrived .leg { animation-play-state: paused; }
  .walker.arrived svg { transform: none; }
  .walker.arrived .leg { transform: rotate(0); }

  .diary-btn {
    position: absolute; left: 172px; bottom: 44px; width: 62px; height: 78px;
    padding: 0; border-radius: 4px 9px 9px 4px;
    background: #3a4ea8; color: #fff8dc; font-size: 15px; line-height: 1.1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    border-left: 8px solid #26357d;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    transform: rotate(-8deg);
  }
  .diary-btn:hover { transform: rotate(-8deg) translateY(-3px); }
  .walker.arrived .diary-btn { animation: glow 1.3s ease-in-out infinite; }
  @keyframes glow { 50% { transform: rotate(-4deg) scale(1.1); box-shadow: 0 0 26px 6px rgba(255,215,106,.7); } }
  .tap-hint {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    font-family: "Caveat Brush", cursive; font-size: 30px; color: var(--moon);
    opacity: 0; transition: opacity .6s ease; white-space: nowrap; margin: 0;
  }
  .tap-hint.on { opacity: 1; }

  /* ---------- letter scene (after Yes) ---------- */
  .letter-scene {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12vh) 24px 0;
    background: radial-gradient(ellipse at 80% 0%, var(--sky-2), var(--sky) 65%);
    opacity: 0; transition: opacity .8s ease;
  }
  .letter-scene.on { opacity: 1; }
  .env-btn {
    position: absolute; left: 168px; bottom: 50px; padding: 0; width: 64px; height: 56px;
    background: transparent; font-size: 50px; line-height: 1; border-radius: 6px;
    transform: rotate(-8deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  .env-btn:hover { transform: rotate(-8deg) translateY(-3px); }
  .walker.arrived .env-btn { animation: glow 1.3s ease-in-out infinite; }
  .letter-wrap {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: rgba(8,10,28,.72); opacity: 0; transition: opacity .5s ease;
  }
  .letter-wrap.on { opacity: 1; }
  .letter-paper {
    width: min(540px, 100%); max-height: 100%; overflow-y: auto;
    background: var(--paper);
    background-image: repeating-linear-gradient(transparent 0 33px, var(--paper-line) 33px 34px);
    background-position: 0 18px;
    border-radius: 10px; padding: 28px 28px 22px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    transform-origin: top center;
    animation: unfold .8s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes unfold { from { transform: scaleY(.05) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .letter-paper .to { font-family: "Caveat Brush", cursive; font-size: 36px; line-height: 1.1; margin: 0 0 12px; }
  .letter-paper p { font-size: 22px; line-height: 34px; margin: 0 0 12px; }
  .letter-paper .from { font-family: "Caveat Brush", cursive; font-size: 30px; text-align: right; color: var(--ink-soft); }
  .letter-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 480px) {
    body { font-size: 19px; }
    .page { padding-left: 68px; padding-right: 16px; }
    .nav { padding-left: 68px; padding-right: 14px; }
    h1 { font-size: 38px; }
    .cat { left: 66px; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<button class="mute" id="mute" hidden aria-label="Toggle music">🎵 music on</button>


<!-- INTRO: Gomeng walks in carrying the diary -->
<div class="intro" id="intro">
  <h2 class="intro-title" id="introTitle">Meowww... Isyraf?</h2>
  <p class="intro-sub" id="introSub">Gomeng is here. He has something for you.</p>
  <div class="ground"></div>
  <div class="walker" id="walker">
    <svg viewBox="0 0 240 150" aria-hidden="true">
      <!-- tail -->
      <path class="tail" d="M40 82 C6 78 4 34 30 30" stroke="var(--cat)" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- back legs -->
      <rect class="leg b" x="58" y="98" width="13" height="38" rx="6" fill="var(--cat-dark)"/>
      <rect class="leg" x="112" y="98" width="13" height="38" rx="6" fill="var(--cat-dark)"/>
      <!-- body -->
      <ellipse cx="94" cy="84" rx="56" ry="30" fill="var(--cat)"/>
      <path d="M70 58 q4 12 0 22 M92 56 q4 12 0 24 M114 58 q4 12 0 22" stroke="var(--cat-dark)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- front legs -->
      <rect class="leg" x="76" y="102" width="13" height="36" rx="6" fill="var(--cat)"/>
      <rect class="leg b" x="130" y="102" width="13" height="36" rx="6" fill="var(--cat)"/>
      <!-- head -->
      <polygon points="140,56 146,26 164,46" fill="var(--cat)"/>
      <polygon points="184,56 178,26 160,46" fill="var(--cat)"/>
      <circle cx="162" cy="68" r="26" fill="var(--cat)"/>
      <ellipse class="eye" cx="152" cy="66" rx="3.6" ry="5" fill="#2a2350"/>
      <ellipse class="eye" cx="172" cy="66" rx="3.6" ry="5" fill="#2a2350"/>
      <circle cx="153.2" cy="64.4" r="1.3" fill="#fff"/><circle cx="173.2" cy="64.4" r="1.3" fill="#fff"/>
      <polygon points="158,75 166,75 162,80" fill="#f6a5b5"/>
      <path d="M186 74 h14 M186 79 l13 4" stroke="var(--cat-dark)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <button class="diary-btn" id="diaryBtn" aria-label="Open Gomeng's diary">Gomeng's<br>Diary<br>🐾</button>
  </div>
  <p class="tap-hint" id="tapHint">tap the diary 👆</p>
</div>

<div class="stage">
  <div class="book" id="book">
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <!-- Gomeng peeking -->
    <svg class="cat" viewBox="0 0 92 70" aria-hidden="true">
      <g>
        <polygon points="10,30 14,4 40,22" fill="var(--cat)"/>
        <polygon points="82,30 78,4 54,22" fill="var(--cat)"/>
        <polygon points="16,24 17,11 27,20" fill="#f6a5b5"/>
        <polygon points="76,24 75,11 65,20" fill="#f6a5b5"/>
        <ellipse cx="46" cy="44" rx="38" ry="28" fill="var(--cat)"/>
        <path d="M32 22 q4 8 0 14 M46 18 v12 M60 22 q-4 8 0 14" stroke="var(--cat-dark)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse class="eye" cx="32" cy="46" rx="4.5" ry="6" fill="#2a2350"/>
        <ellipse class="eye" cx="60" cy="46" rx="4.5" ry="6" fill="#2a2350"/>
        <circle cx="33.5" cy="44" r="1.6" fill="#fff"/><circle cx="61.5" cy="44" r="1.6" fill="#fff"/>
        <polygon points="42,54 50,54 46,59" fill="#f6a5b5"/>
        <path d="M46 59 q-4 5 -8 2 M46 59 q4 5 8 2" stroke="#2a2350" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M14 54 h-12 M14 59 l-11 4 M78 54 h12 M78 59 l11 4" stroke="var(--cat-dark)" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </svg>

    <div id="pages"></div>

    <div class="nav">
      <button class="ghost" id="back" hidden>← back</button>
      <span class="dots" id="dots"></span>
      <button id="next">open diary</button>
    </div>
  </div>
</div>
<script>
/* ------------------------------------------------------------------
   EDIT YOUR DIARY HERE.
   Each entry: { date, title (optional), text: [paragraphs], sig (optional) }
   ------------------------------------------------------------------ */
const ENTRIES = [
  {
    cover: true,
    title: "Gomeng's Secret Diary 🐾",
    text: [
      "Property of Gomeng, orange cat, professional napper.",
      "Do not read unless your name is Isyraf."
    ],
    stamp: "TOP SECRET"
  },
  {
    date: "Day 1, 2:07 am",
    text: [
      "My human is smiling at the phone again. In the dark. At 2 in the morning.",
      "I said meow. No reaction. Apparently someone named Isyraf is more interesting than me. I am not offended. (I am a little offended.)"
    ]
  },
  {
    date: "Day 2",
    title: "Perintis & Pewaris",
    text: [
      "Today my human called you Perintis. Then you called them Pewaris.",
      "I don't understand what it means, but they laughed so hard they nearly fell off the bed. It's clearly a secret club with only two members. I applied to join. Rejected.",
      "Whatever it is, it's the happiest I've seen my human all week."
    ]
  },
  {
    date: "Day 3, very late",
    title: "Where did the time go?",
    text: [
      "Chat started at 10 pm. \"Just a little while,\" they said.",
      "Next thing I know the birds are singing, the sky is orange, and my food bowl is still empty. Time does not exist when my human is talking to you. I have filed a formal complaint.",
      "But I also noticed something: they never once looked tired. Only happy."
    ]
  },
  {
    date: "Day 4",
    title: "The song situation",
    text: [
      "You uploaded a new song today. My human stared at it for ten whole minutes.",
      "\"Is this about me? Or not? Maybe not. Maybe yes? No, don't be silly.\" Then they played it again. And again. I have now heard it 47 times. I am officially an expert.",
      "My professional verdict: I hope it is."
    ]
  },
  {
    date: "Day 5",
    title: "Evidence I have collected",
    text: [
      "1. Goes quiet and pink whenever your name pops up on the screen.",
      "2. Rereads your messages. Sometimes three times. I counted.",
      "3. Saves every silly thing you say to them.",
      "4. Says \"we're just friends\" but says it very, very slowly."
    ]
  },
  {
    date: "Day 6, tonight",
    title: "So I took the pen.",
    text: [
      "My human is too shy to say it, so I, Gomeng, grabbed the pen myself. (Paw. Whatever.)",
      "Isyraf, my human really likes you. Not just Perintis-and-Pewaris likes you. The real kind. The kind that makes them lose track of time.",
      "So I have one question on their behalf:"
    ],
    final: true,
    question: "Will you go out with my human? 🥺"
  }
];

/* ---------------- stars ---------------- */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 40; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 3.5) + 's';
  starsEl.appendChild(s);
}

/* ---------------- music (soft music box, generated, no files needed) ---------------- */
let ac = null, musicOn = false, musicTimer = null, step = 0;
const NOTES = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.0, 698.46,
               659.25, 783.99, 987.77, 783.99, 587.33, 698.46, 783.99, 523.25];
function ping(freq, t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.09, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + 1.5);
}
function startMusic() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    musicOn = true;
    clearInterval(musicTimer);
    musicTimer = setInterval(() => {
      if (!musicOn) return;
      ping(NOTES[step % NOTES.length], ac.currentTime + 0.05);
      if (step % 4 === 0) ping(NOTES[step % NOTES.length] / 2, ac.currentTime + 0.05);
      step++;
    }, 520);
  } catch (e) { /* audio unavailable: page still works */ }
}
function stopMusic() { musicOn = false; clearInterval(musicTimer); }
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  if (musicOn) { stopMusic(); muteBtn.textContent = '🔇 music off'; }
  else { startMusic(); muteBtn.textContent = '🎵 music on'; }
});

/* ---------------- diary ---------------- */
const pagesEl = document.getElementById('pages');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const dotsEl = document.getElementById('dots');
let cur = 0, typer = null, fullText = null;

ENTRIES.forEach((e, i) => {
  const d = document.createElement('div');
  d.className = 'page'; d.id = 'p' + i;
  let html = '';
  if (e.stamp) html += `<span class="stamp">${e.stamp}</span>`;
  if (e.date) html += `<p class="date">${e.date}</p>`;
  if (e.title) html += `<h1>${e.title}</h1>`;
  html += `<div class="txt"></div>`;
  if (e.final) {
    html += `<div class="reveal" hidden>
      <h1 style="font-size:36px">${e.question}</h1>
      <div class="final-btns">
        <button id="yes">Yes 💕</button>
        <button id="no">No</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>`;
  }
  if (!e.cover && !e.final) html += `<p class="sig">– Gomeng 🐾</p>`;
  d.innerHTML = html;
  pagesEl.appendChild(d);
});

function typeText(page, entry) {
  const box = page.querySelector('.txt');
  fullText = entry.text.map(t => `<p>${t}</p>`).join('');
  box.innerHTML = '';
  clearInterval(typer);
  // type paragraph by paragraph using plain text length; keeps markup safe
  let pi = 0, ci = 0;
  const ps = entry.text;
  const els = ps.map(() => { const p = document.createElement('p'); box.appendChild(p); return p; });
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  typer = setInterval(() => {
    if (pi >= ps.length) { finishTyping(page, entry); return; }
    const chunk = ps[pi].slice(0, ci += 2);
    els[pi].textContent = chunk;
    els[pi].appendChild(cursor);
    if (ci >= ps[pi].length) { els[pi].textContent = ps[pi]; pi++; ci = 0; }
  }, 22);
}
function finishTyping(page, entry) {
  clearInterval(typer); typer = null;
  page.querySelector('.txt').innerHTML = fullText;
  if (entry.final) page.querySelector('.reveal').hidden = false;
}

function show(i) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('p' + i);
  page.classList.add('active');
  page.scrollTop = 0;
  cur = i;
  typeText(page, ENTRIES[i]);
  backBtn.hidden = i === 0;
  nextBtn.hidden = !!ENTRIES[i].final;
  nextBtn.textContent = i === 0 ? 'open diary' : 'next page';
  dotsEl.textContent = i === 0 ? '' : `${i} / ${ENTRIES.length - 1}`;
}

nextBtn.addEventListener('click', () => {
  if (typer) { finishTyping(document.getElementById('p' + cur), ENTRIES[cur]); return; }
  if (cur < ENTRIES.length - 1) show(cur + 1);
});
backBtn.addEventListener('click', () => { if (cur > 0) show(cur - 1); });
show(0);

/* ---------------- final: runaway No + celebration ---------------- */
const noMsgs = [
  "Gomeng says: try again 🐾",
  "Nope, the button is shy too.",
  "Gomeng is judging you 😾",
  "Even the No button wants you to say yes.",
  "Gomeng will keep this up all night. Cats have stamina."
];
let tries = 0;
const noBtn = document.getElementById('no');
function dodge(ev) {
  if (ev) ev.preventDefault();
  noBtn.classList.add('run');
  const w = window.innerWidth, h = window.innerHeight;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  noBtn.style.left = Math.max(8, Math.random() * (w - bw - 16)) + 'px';
  noBtn.style.top = Math.max(8, Math.random() * (h - bh - 16)) + 'px';
  document.getElementById('hint').textContent = noMsgs[Math.min(tries++, noMsgs.length - 1)];
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', dodge, { passive: false });
noBtn.addEventListener('click', dodge);
noBtn.addEventListener('focus', dodge);

function celebrate() {
  const em = ['💕', '💖', '🐾', '✨', '🎉', '🧡'];
  for (let i = 0; i < 60; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = em[Math.floor(Math.random() * em.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (18 + Math.random() * 26) + 'px';
    h.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    h.style.animationDelay = (Math.random() * 1.5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

   EDIT YOUR LETTER HERE. Each string in "body" is one paragraph.        */
const LETTER = {
  to: "Dear Isyraf,",
  body: [
    "If you're reading this, it means Gomeng did his job and you said yes. He is very proud of himself.",
    "I don't know exactly when it started. Maybe somewhere between Perintis and Pewaris. Maybe on one of those nights when we said 'just five more minutes' and it turned into sunrise.",
    "I used to wonder if the songs you uploaded were about me. Now I get to ask you properly, face to face.",
    "Thank you for making late nights feel short, and for making me laugh at things nobody else finds funny. I'm really happy it's you.",
    "So... what song are we listening to first?"
  ],
  from: "Yours, (your name) 💕"
};

const CAT_SVG = walker.querySelector('svg').outerHTML;

function showLetterScene() {
  const sc = document.createElement('div');
  sc.className = 'letter-scene';
  sc.innerHTML = `
    <h2 class="intro-title">Wait... Gomeng isn't done.</h2>
    <p class="intro-sub">He has one more thing for you.</p>
    <div class="ground"></div>
    <div class="walker" style="animation-duration:3.5s">${CAT_SVG}<button class="env-btn" aria-label="Open the letter">💌</button></div>
    <p class="tap-hint">tap the letter 👆</p>`;
  document.body.appendChild(sc);
  requestAnimationFrame(() => sc.classList.add('on'));
  const w = sc.querySelector('.walker'), hint = sc.querySelector('.tap-hint');
  setTimeout(() => { w.classList.add('arrived'); hint.classList.add('on'); }, 3600);
  sc.querySelector('.env-btn').addEventListener('click', () => openLetter(sc));
}

function openLetter(sc) {
  const wrap = document.createElement('div');
  wrap.className = 'letter-wrap';
  wrap.innerHTML = `<div class="letter-paper" role="dialog" aria-label="Letter for Isyraf">
      <p class="to">${LETTER.to}</p><div id="lbody"></div>
      <p class="from" id="lfrom" style="opacity:0">${LETTER.from}</p>
      <div class="letter-actions"><button id="lclose">close 💌</button></div>
    </div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('on'));
  const box = wrap.querySelector('#lbody'), from = wrap.querySelector('#lfrom');
  const els = LETTER.body.map(() => { const p = document.createElement('p'); box.appendChild(p); return p; });
  let pi = 0, ci = 0, t;
  function finish() { clearInterval(t); LETTER.body.forEach((x, i) => els[i].textContent = x); from.style.opacity = 1; }
  t = setInterval(() => {
    if (pi >= LETTER.body.length) { finish(); return; }
    ci += 2;
    els[pi].textContent = LETTER.body[pi].slice(0, ci);
    if (ci >= LETTER.body[pi].length) { pi++; ci = 0; }
  }, 28);
  wrap.querySelector('.letter-paper').addEventListener('click', e => { if (e.target.id !== 'lclose') finish(); });
  wrap.querySelector('#lclose').addEventListener('click', () => {
    clearInterval(t);
    wrap.classList.remove('on'); sc.classList.remove('on');
    setTimeout(() => { wrap.remove(); sc.remove(); }, 700);
  });
}

    <p class="sig">– Gomeng 🐾 (and my human 💕)</p>`;
  celebrate();
  setTimeout(showLetterScene, 4800);
});
